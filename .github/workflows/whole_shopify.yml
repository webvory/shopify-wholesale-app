name: Build, Push and Deploy Wholesale App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-west-1 | \
          docker login --username AWS --password-stdin \
          450367038243.dkr.ecr.us-west-1.amazonaws.com

      - name: Build Image
        run: docker build -t shopify-wholesale-app .

      - name: Tag Image
        run: |
          docker tag shopify-wholesale-app:latest \
            450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest

          docker tag shopify-wholesale-app:latest \
            450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:${{ github.sha }}

      - name: Push Image
        run: |
          docker push 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest
          docker push 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION
          script: |
            set -euxo pipefail

            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION

            aws ecr get-login-password --region us-west-1 | \
            docker login --username AWS --password-stdin \
            450367038243.dkr.ecr.us-west-1.amazonaws.com

            docker pull 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest
            docker tag 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest shopify-wholesale-app:latest || true
            docker tag 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest shopify-wholesale-app || true

            echo "=== Finding and updating docker compose directory ==="
            COMPOSE_DIR=""
            if [ -f "$HOME/wholesale-app/shopify-wholesale-app/docker-compose.yml" ] || [ -f "$HOME/wholesale-app/shopify-wholesale-app/docker-compose.yaml" ]; then
              COMPOSE_DIR="$HOME/wholesale-app/shopify-wholesale-app"
            elif [ -f "$HOME/wholesale-app/docker-compose.yml" ] || [ -f "$HOME/wholesale-app/docker-compose.yaml" ]; then
              COMPOSE_DIR="$HOME/wholesale-app"
            elif [ -f "$HOME/shopify-wholesale-app/docker-compose.yml" ] || [ -f "$HOME/shopify-wholesale-app/docker-compose.yaml" ]; then
              COMPOSE_DIR="$HOME/shopify-wholesale-app"
            else
              FOUND=$(find "$HOME" /var/www -maxdepth 4 -name "docker-compose.y*ml" 2>/dev/null | head -n 1 || true)
              if [ -n "$FOUND" ]; then
                COMPOSE_DIR=$(dirname "$FOUND")
              fi
            fi

            if [ -n "$COMPOSE_DIR" ]; then
              echo "Found compose in $COMPOSE_DIR"
              cd "$COMPOSE_DIR"
              git pull origin main || true
              docker compose down --remove-orphans || docker-compose down --remove-orphans || true
              docker compose up -d --force-recreate || docker-compose up -d --force-recreate || true
            fi

            # Force stop and remove any old containers on port 3000 if not handled
            OLD_CONTAINERS=$(docker ps -q --filter "publish=3000" || true)
            if [ -z "$OLD_CONTAINERS" ] && [ -z "$COMPOSE_DIR" ]; then
              echo "Starting standalone container..."
              docker run -d -p 3000:3000 --restart always --name wholesale-app 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest
            fi

            echo "=== Active Containers ==="
            docker ps

            docker image prune -f
