name: Build, Push and Deploy Wholesale App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-west-1 | \
          docker login --username AWS --password-stdin \
          450367038243.dkr.ecr.us-west-1.amazonaws.com

      - name: Build Image
        run: docker build -t shopify-wholesale-app .

      - name: Tag Image
        run: |
          docker tag shopify-wholesale-app:latest \
            450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest

          docker tag shopify-wholesale-app:latest \
            450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:${{ github.sha }}

      - name: Push Image
        run: |
          docker push 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest
          docker push 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION
          script: |
            set -euxo pipefail

            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION

            aws ecr get-login-password --region us-west-1 | \
            docker login --username AWS --password-stdin \
            450367038243.dkr.ecr.us-west-1.amazonaws.com

            docker pull 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest
            docker tag 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest shopify-wholesale-app:latest || true
            docker tag 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest shopify-wholesale-app || true

            # Stop any container listening on port 3000 or named wholesale
            CONTAINERS_TO_STOP=$(docker ps -q --filter "publish=3000" --filter "name=wholesale" || true)
            if [ -n "$CONTAINERS_TO_STOP" ]; then
              echo "Stopping old containers: $CONTAINERS_TO_STOP"
              docker stop $CONTAINERS_TO_STOP || true
              docker rm -f $CONTAINERS_TO_STOP || true
            fi

            DEPLOYED=false
            for dir in "$HOME/wholesale-app/shopify-wholesale-app" "$HOME/wholesale-app" "$HOME/shopify-wholesale-app" "/var/www/wholesale-app" "/var/www/shopify-wholesale-app"; do
              if [ -d "$dir" ]; then
                echo "Updating deployment in: $dir"
                cd "$dir"
                git pull origin main || true
                if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
                  docker compose down --remove-orphans || docker-compose down --remove-orphans || true
                  docker compose up -d --force-recreate || docker-compose up -d --force-recreate || true
                  DEPLOYED=true
                fi
                if command -v pm2 >/dev/null 2>&1 && [ -f "package.json" ]; then
                  npm ci || true
                  npx prisma generate || true
                  npm run build || true
                  pm2 restart all || true
                  DEPLOYED=true
                fi
              fi
            done

            if [ "$DEPLOYED" = false ]; then
              echo "Starting standalone Docker container from pulled image..."
              docker run -d --name wholesale-app -p 3000:3000 --restart always 450367038243.dkr.ecr.us-west-1.amazonaws.com/shopify-wholesale-app:latest || true
            fi

            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl restart wholesale-app || sudo systemctl restart shopify-wholesale-app || true
            fi

            echo "=== Docker Containers ==="
            docker ps

            docker image prune -f
